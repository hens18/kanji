<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kanji Sushi AYCE, Springfield VA</title>
  <meta name="description" content="All-you-can-eat sushi and hibachi in Springfield, VA, delivered to your table by train. Read what our guests say.">
  <meta name="theme-color" content="#121c26">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23f2886a'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%23f1ece2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/reviews.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <main id="main" tabindex="-1">

    <section class="reviews" id="reviews" aria-labelledby="reviews-title">
      <div class="reviews__head">
        <div>
          <p class="reviews__kicker">Fresh off the belt</p>
          <h2 class="reviews__title" id="reviews-title">Arrive hungry. <em>Leave very happy.</em></h2>
          <p class="reviews__lede">Real words from real guests on Yelp. Sushi, hibachi, and a little train that brings it to your table.</p>
        </div>
        <div class="belt__controls">
          <button class="btn" type="button" data-belt-prev aria-label="Previous review">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
          </button>
          <button class="btn" type="button" data-belt-next aria-label="Next review">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
          </button>
          <button class="btn" type="button" data-belt-pause aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
            <span>Pause belt</span>
          </button>
          <p class="sr-only" role="status" data-belt-status></p>
        </div>
      </div>

      <div class="belt">
        <ul class="belt__track" tabindex="0" aria-label="Guest reviews. Use left and right arrow keys to move along the belt."></ul>
        <div class="belt__rail" aria-hidden="true"></div>
      </div>

      <div class="reviews__foot">
        <a class="reviews__cta" href="https://www.yelp.com/biz/kanji-sushi-ayce-west-springfield" target="_blank" rel="noopener">Read all reviews on Yelp</a>
        <p class="reviews__src">Reviews shared from <a href="https://www.yelp.com/biz/kanji-sushi-ayce-west-springfield" target="_blank" rel="noopener">Yelp</a>. Been in? We would love to hear from you.</p>
      </div>
    </section>

  </main>
  <script src="assets/reviews.js"></script>
</body>
</html>
